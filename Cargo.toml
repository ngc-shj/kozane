[workspace]
resolver = "3"
members = ["crates/audit-event", "crates/config", "crates/cpu", "crates/data-core", "crates/hs-core", "crates/ingress-core", "crates/key-core", "crates/inner-core", "crates/layout", "crates/msgs", "crates/netdrv", "crates/pdkit", "crates/pds/audit", "crates/pds/data", "crates/pds/eth-in", "crates/pds/eth-out", "crates/pds/hello", "crates/pds/hs", "crates/pds/ingress", "crates/pds/inner", "crates/pds/key", "crates/pds/timer", "crates/ring", "crates/secret-blob", "crates/wg-core", "crates/wg-wire", "crates/wire", "tools/laws", "tools/mksecrets"]

[workspace.package]
edition = "2024"
license = "BSD-2-Clause"

[workspace.dependencies]
# Pinned rev: seL4 16.0.0 + Microkit 2.3.0 compatible, toolchain nightly-2026-08-21.
sel4-microkit = { git = "https://github.com/seL4/rust-sel4", rev = "86a0dbf4f53e6766734331c5df61851489ed38a1", default-features = false }
sel4-virtio-hal-impl = { git = "https://github.com/seL4/rust-sel4", rev = "86a0dbf4f53e6766734331c5df61851489ed38a1" }
virtio-drivers = { version = "=0.13.0", default-features = false, features = ["alloc"] }

[profile.release]
panic = "abort"
opt-level = "s"
debug = 0
overflow-checks = true

# Used by `cargo bolero test` (libFuzzer engine).
[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1
