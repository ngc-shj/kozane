# Gateway configuration compiled into the image (law L6). Public values only.
# The keys below are placeholders for builds without a deployment config;
# integration tests generate their own config and secrets (tools/mksecrets).
# Key files are relative to this file; rp_hash is BLAKE2s-256 of the file.
# The TLS certificate is a placeholder too: tools/mkcert issued it for
# 10.0.2.15 to a P-256 key that was discarded, so no blob matches it
# (`key` reports TlsKeyMismatch; mksecrets writes a matching pair).

[gateway]
public_key = "78wdDVL8XdPitWIiZQ7OBEnnlJfytmjgXqe3dz2gyGA="
listen_port = 51820
rp_port = 51819
https_port = 443
rp_pub_path = "keys/gateway.rp.pk"
rp_hash = "21f9f2594f944af3571a8de5748b6dc23f57182326d117764b553155af0d3cbc"
outside_ip = "10.0.2.15"
outside_mac = "52:54:00:12:34:56"
outside_router_mac = "52:55:0a:00:02:02"
inside_ip = "10.99.0.1"
inside_prefix = "10.99.0.0/24"
inside_mac = "52:54:00:12:34:57"
# HTTPS proxy (M6 plan C3, C4, C11): backend source ports, the backend (an
# inside neighbor), the server certificate and its public key.
tls_ports = { start = 40000, count = 1024 }
backend = { ip = "10.99.0.2", port = 8080 }
tls_cert = "keys/tls.der"
tls_public = "0479fa8395eb4c1695b78fe7fadd6130e94680031e5fea030b57baa7b2a952ccfff79caeeb7b82c74ae6812cb95d58ff5e76ea5a08ea055d824bdd586e29d10720"

[[neighbors]]
ip = "10.99.0.2"
mac = "02:00:00:00:99:02"

[[peers]]
wg_pub = "YBS8Ds6hLNV9RKN63rn+Z7o/7hO6Iwmh1xhxEHInuGg="
rp_pub_path = "keys/peer-0.rp.pk"
rp_hash = "dca15eb47af3a4a3022bc1baa044231b27bdd6c98f1abd8b1294b8c971f37fb3"
allowed_ips = ["10.200.0.2/32"]
