[package]
name = "ct-harness"
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"
publish = false

# Not a member of the secureos workspace (M4 plan C9): `make ct` builds it
# for support/targets/aarch64-ct-harness.json with build-std, under its own
# lock, so that its codegen is the PD's and C10 can compare the two.
[workspace]

[dependencies]
mce460896 = { path = "../../crates/mce460896" }
# The envelope-open closure the key PDs ship (M5 plan I10.3), and
# what the residue case seals with.
secret-blob = { path = "../../crates/secret-blob" }
tpm2 = { path = "../../crates/tpm2" }
tpm2-wire = { path = "../../crates/tpm2-wire" }
# The hybrid exchange and its scrub `tls` ships (M6 plan C7, T-R4-1).
tls-core = { path = "../../crates/tls-core" }
# Every libcrux crate tls-core pulls, at the root lock's version and with
# tls-core's features only, so that the harness compiles the code the PD
# ships (T-R5-1). The client side of the residue case (ML-KEM keygen and
# decapsulation, X25519) calls the first two directly.
libcrux-ml-kem = { version = "=0.0.11", default-features = false, features = ["mlkem768"] }
libcrux-curve25519 = { version = "=0.0.9", default-features = false }
libcrux-chacha20poly1305 = { version = "=0.0.10", default-features = false }
libcrux-hacl-rs = { version = "=0.0.6", default-features = false }
libcrux-hmac = { version = "=0.0.9", default-features = false }
libcrux-intrinsics = { version = "=0.0.9", default-features = false }
libcrux-macros = { version = "=0.0.4", default-features = false }
libcrux-platform = { version = "=0.0.4", default-features = false }
libcrux-poly1305 = { version = "=0.0.7", default-features = false }
libcrux-secrets = { version = "=0.0.7", default-features = false }
libcrux-sha2 = { version = "=0.0.9", default-features = false }
libcrux-sha3 = { version = "=0.0.11", default-features = false }
libcrux-traits = { version = "=0.0.9", default-features = false }
# The same versions mce460896 resolves to in the root lock: the expected
# values (sha3) and the residue scan's keccak-state needles (keccak).
sha3 = { version = "=0.10.9", default-features = false }
keccak = "=0.1.6"
libc = "=0.2.191"

# The PD's codegen (M4 plan C9 "Build"); line tables only, so that memcheck
# reports name file:line.
[profile.release]
panic = "abort"
opt-level = "s"
overflow-checks = true
debug = "line-tables-only"

# wg-core's wg-wire depends on vstd: built from the vendored sources the
# root workspace patches in (M5 plan C5), never from the registry.
[patch.crates-io]
vstd = { path = "../../third_party/verus/vstd" }
verus_builtin = { path = "../../third_party/verus/verus_builtin" }
verus_builtin_macros = { path = "../../third_party/verus/verus_builtin_macros" }
verus_state_machines_macros = { path = "../../third_party/verus/verus_state_machines_macros" }
verus_syn = { path = "../../third_party/verus/verus_syn" }
verus_prettyplease = { path = "../../third_party/verus/verus_prettyplease" }
