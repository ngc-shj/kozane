[package]
name = "mksecrets"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# The audit key's public half (M8 plan C10), as `auditkey` derives it.
auditkey-core = { path = "../../crates/auditkey-core" }
# `validate.rs` (M8 plan C1 R2), shared with `config`'s build.rs.
limits = { path = "../../crates/limits" }
policy-wire = { path = "../../crates/policy-wire" }
secret-blob = { path = "../../crates/secret-blob" }
libc = "=0.2.191"
libcrux-curve25519 = { version = "=0.0.9", default-features = false }
mce460896 = { path = "../../crates/mce460896" }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=0.9.8"
tpm2 = { path = "../../crates/tpm2" }
tpm2-wire = { path = "../../crates/tpm2-wire" }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
