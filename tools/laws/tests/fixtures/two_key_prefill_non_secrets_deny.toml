[pds.caller_a]
role = "service"

[pds.caller_b]
role = "service"

[pds.key]
role = "key"

[pds.pqkey]
role = "key"

[mrs.key_secrets]
kind = "secrets"
owner = "key"

[mrs.pq_secrets]
kind = "secrets"
owner = "pqkey"

[mrs.ring]
kind = "plain"
shares = { caller_a = "rw" }

[[channels]]
between = ["caller_a", "key"]
pp = { caller_a = true, key = false }
notify = { caller_a = false, key = true }

[[channels]]
between = ["caller_b", "pqkey"]
pp = { caller_b = true, pqkey = false }
notify = { caller_b = false, pqkey = true }

[budgets]
ratio_cap = 0.5
ratio_sum_cap = 0.9

[board]
ram = [{ start = 0x4000_0000, size = 0x8000_0000 }]
