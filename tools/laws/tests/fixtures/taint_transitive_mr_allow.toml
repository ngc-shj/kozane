[pds.driver]
role = "driver"

[pds.mid]
role = "service"

[pds.far]
role = "service"

[mrs.device_mr]
kind = "device"
owner = "driver"
phys_addr = 0x9000000
size = 0x1000

[mrs.link_1]
kind = "plain"
shares = { driver = "rw", mid = "rw" }

[mrs.link_2]
kind = "plain"
shares = { mid = "rw", far = "rw" }

[budgets]
ratio_cap = 0.5
ratio_sum_cap = 0.9

[board]
ram = [{ start = 0x4000_0000, size = 0x8000_0000 }]
