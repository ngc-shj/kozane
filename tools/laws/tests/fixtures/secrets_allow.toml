[pds.driver]
role = "driver"

[pds.ingress]
role = "untrusted_input"

[pds.key]
role = "key"

[mrs.device_mr]
kind = "device"
owner = "driver"

[mrs.shared_mr]
kind = "plain"
shares = { driver = "rw", ingress = "rw" }

[mrs.secrets_mr]
kind = "secrets"

[budgets]
ratio_cap = 0.5
ratio_sum_cap = 0.9
