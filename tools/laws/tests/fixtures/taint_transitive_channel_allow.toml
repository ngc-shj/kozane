[pds.driver]
role = "driver"

[pds.mid]
role = "service"

[pds.far]
role = "service"

[mrs.device_mr]
kind = "device"
owner = "driver"
phys_addr = 0x9000000
size = 0x1000

[[channels]]
between = ["driver", "mid"]

[[channels]]
between = ["mid", "far"]

[budgets]
ratio_cap = 0.5
ratio_sum_cap = 0.9

[board]
ram = [{ start = 0x4000_0000, size = 0x8000_0000 }]
