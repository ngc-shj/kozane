# Peer-policy signing toolchain: draft, approve, sign and verify bundles,
# and keep the approval ledger (M8 plan C2, D11). Its own workspace, as
# tools/release's, so libcrux and the policy signing keys never enter the
# PD build's lock.
[package]
name = "policy"
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"

[workspace]

[dependencies]
libcrux-ml-dsa = { version = "=0.0.11", default-features = false, features = ["std", "mldsa65"] }
libcrux-ed25519 = "=0.0.10"
# Wipes the decode-time copies of the signing keys (L12), as tools/release.
zeroize = { version = "=1.9.1", features = ["alloc"] }
sha2 = "=0.10.9"
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=0.9.8"
# The bundle format and its bounds (M8 plan C1); `verifier` for `parse`
# against a node without a device-held token, `render` for the host-side
# encoder.
limits = { path = "../../crates/limits" }
policy-wire = { path = "../../crates/policy-wire", features = ["render", "verifier"] }
# `validate.rs` (M8 plan C1 R2), shared with `config`'s build.rs and
# tools/mksecrets: the `fleet` command renders each node's `NodeConfig`
# through the same checks, not a second parser.
secret-blob = { path = "../../crates/secret-blob" }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
