[package]
name = "rosenpass-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
rosenpass-wire = { path = "../rosenpass-wire" }
classic-mceliece-rust = { version = "=2.0.2", default-features = false, features = ["mceliece460896", "zeroize"] }
libcrux-blake2 = { version = "=0.0.9", default-features = false }
libcrux-chacha20poly1305 = { version = "=0.0.10", default-features = false }
libcrux-ml-kem = { version = "=0.0.11", default-features = false, features = ["kyber", "mlkem512"] }
zeroize = { version = "=1.8.1", default-features = false }
rand_core = { version = "=0.6.4", default-features = false }
# Keyed SHAKE256 for the cookie tree (M3b plan C1); already locked through
# classic-mceliece-rust.
sha3 = { version = "=0.10.9", default-features = false }

[dev-dependencies]
# The ingress PD's cookie adapter is tested here by path (M3b plan C3).
ingress-core = { path = "../ingress-core" }
