[package]
name = "policy-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
layout = { path = "../layout" }
limits = { path = "../limits" }
# `open` and `Verified::from_reply` only: never the `verifier` feature
# (check-pins P27), so a barrier PD reaches a `Bundle` through a token alone.
policy-wire = { path = "../policy-wire" }
# BLAKE2s, the rp digest `open` checks peers against (as `policy` does).

# The PPC and the slot symbols exist on the PD target only; the decoding and
# the slot choice are host-tested.
[target.'cfg(target_os = "none")'.dependencies]
sel4-microkit = { workspace = true }

[dev-dependencies]
policy-wire = { path = "../policy-wire", features = ["render"] }
