[package]
name = "audit-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# The request and reply encodings of `auditkey`'s SIGN (M8 plan D7).
auditkey-core = { path = "../auditkey-core" }
layout = { path = "../layout" }
# The line chain's SHA-256, at the policy PD's pin, core only; already in the
# PD lock. Kani reaches none of it: the harnesses cover the ready gate and
# the scheduling.
libcrux-sha2 = { version = "=0.0.9", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
