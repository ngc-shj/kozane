[package]
name = "tls-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# Every primitive of the TLS 1.3 profile (M6 plan D1, C7), pinned to the
# versions the rest of the workspace locks; ML-KEM-768 is its own feature,
# which the per-PD build keeps out of `pq`.
libcrux-chacha20poly1305 = { version = "=0.0.10", default-features = false }
libcrux-curve25519 = { version = "=0.0.9", default-features = false }
libcrux-hkdf = { version = "=0.0.9", default-features = false }
libcrux-hmac = { version = "=0.0.9", default-features = false }
libcrux-ml-kem = { version = "=0.0.11", default-features = false, features = ["mlkem768"] }
libcrux-sha2 = { version = "=0.0.9", default-features = false }
