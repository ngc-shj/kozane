[package]
name = "policy-wire"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
limits = { path = "../limits" }

[dev-dependencies]
bolero = "=0.13.4"

[features]
# `render` (the host-side encoder): the `policy` PD and `policy-wire`'s own
# Kani proofs never need it; `tools/policy` and tests do.
render = []
# `verifier`: `parse` without a token, for the side that checked the
# signatures itself (the `policy` PD, `tools/policy`); check-pins keeps it
# out of every other crate.
verifier = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
