[package]
name = "auditkey-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
layout = { path = "../layout" }
# Ed25519 checkpoint signatures (M8 plan D7), at tools/release's and the
# policy PD's pin, core only; already in the PD lock (slice 3). Kani reaches
# none of it: the harnesses cover the parser and the seq rule.
libcrux-ed25519 = { version = "=0.0.10", default-features = false }
secret-blob = { path = "../secret-blob" }
zeroize = { version = "=1.8.1", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
