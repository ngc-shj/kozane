# Functions each verified crate must keep inside verus! with an ensures
# (M4 plan C1). Removing a spec, or moving a function out of verus!, fails
# the Verus gate even when everything left still verifies.

[crates.wg-wire]
functions = [
    # C2: the replay window.
    "below_window", "check_and_update",
    # C2: the codecs and their round trips.
    "parse", "emit", "emit_transport_header",
    "lemma_u32_le_roundtrip", "lemma_u32_le_inverse",
    "lemma_u64_le_roundtrip", "lemma_u64_le_inverse",
    "lemma_spec_emit_initiation_parses", "lemma_spec_emit_initiation_inverse",
    "lemma_spec_emit_response_parses", "lemma_spec_emit_response_inverse",
    "lemma_spec_emit_cookie_reply_parses", "lemma_spec_emit_cookie_reply_inverse",
    "lemma_spec_emit_transport_header_parses", "lemma_spec_emit_transport_header_inverse",
]

[crates.rosenpass-wire]
functions = [
    # C4: the codecs, peek_type, and the round trips.
    "parse", "emit", "peek_type", "lemma_peek_type_agrees",
    "lemma_spec_emit_init_hello_parses", "lemma_spec_emit_init_hello_inverse",
    "lemma_spec_emit_resp_hello_parses", "lemma_spec_emit_resp_hello_inverse",
    "lemma_spec_emit_init_conf_parses", "lemma_spec_emit_init_conf_inverse",
    "lemma_spec_emit_empty_data_parses", "lemma_spec_emit_empty_data_inverse",
]

[crates.msgs]
functions = [
    # C3: every `pub fn decode` site, its encode, and the round trips.
    "decode", "encode",
    "lemma_spec_encode_initiation_decodes", "lemma_spec_encode_initiation_inverse",
    "lemma_spec_encode_response_decodes", "lemma_spec_encode_response_inverse",
    "lemma_spec_encode_install_decodes", "lemma_spec_encode_install_inverse",
    "lemma_spec_encode_psk_install_decodes", "lemma_spec_encode_psk_install_inverse",
    "lemma_spec_encode_transport_decodes", "lemma_spec_encode_transport_inverse",
    "lemma_spec_encode_rp_datagram_decodes", "lemma_spec_encode_rp_datagram_inverse",
    "lemma_spec_encode_rp_reply_reply_decodes", "lemma_spec_encode_rp_reply_reply_inverse",
    "lemma_spec_encode_rp_reply_no_reply_decodes",
    "lemma_spec_encode_to_ingress_outbound_decodes", "lemma_spec_encode_to_ingress_outbound_inverse",
    "lemma_spec_encode_to_ingress_endpoint_decodes", "lemma_spec_encode_to_ingress_endpoint_inverse",
    # The trusted helper keeps its contract (checked by Kani).
    "chunk_ref",
]
