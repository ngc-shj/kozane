# M4 plan C10, checked by tools/ct-shape.
#
# [[function]] (C10 (c), the shape baseline): one entry per function of each
# PD's closure from its mce460896 root, and the encaps shim's carrier in
# pd-pq; since M5 (I10.3) also of the envelope-open closure
# (tpm2::envelope::open_sealed) in pd-key and pd-pqkey, and since M6 (plan
# C12) in pd-tlskey, which the C9 residue harness runs (its CT mode does not: those justifications claim no
# C9 CT run). `shape` is the multiset of the function's conditional instructions
# (b.<cond>, cbz/cbnz, tbz/tbnz, and the csel/cset/ccmp family with their
# condition) and of its memory accesses indexed by a register. A change is a
# tripwire, not a verdict: C9 is its recovery path. Names are demangled with
# hashes stripped; ` @crate` is a generic's instantiating crate; `a = b` is
# one body under several merged names.
#
# `tools/ct-shape --print-baseline` prints the current [[function]] entries
# (justifications kept where the shape is unchanged) for review. No make
# target writes this file.
#
# [[divide]] (C10 (b)): a udiv/sdiv C10 (b) would refuse, accepted at that
# one function and instruction. Owner-approved 2026-10-22 (C10 listed no
# exception; M4 deviation log, M2b; residual R-M9): both are core iterator code that sha3/digest and bm's
# chunks_mut instantiate, dividing a public slice length by a public chunk
# size; they cannot be removed from mce460896 alone. An entry that matches no
# instruction fails. br/blr, memcmp/bcmp and the valgrind preamble have no
# such list.

