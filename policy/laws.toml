# policy/laws.toml — C7 laws-checker policy (tools/laws).
#
# Describes the architecture-wide allowlist that `tools/laws check` enforces
# against a Microkit `.system` file. See
# docs/archive/review/secureos-pq-vpn-architecture-plan.md, "Architecture-wide
# security laws" (L1-L13) and contract C7, for the laws themselves.
# Anything in the `.system` not described here is a violation of L4
# (default deny).
#
# Schema:
#
#   [pds.<name>]
#   role = "driver" | "untrusted_input" | "key" | "data" | "service" | "timer" | "tpm"
#   irqs = [<n>, ...]
#     Every pd in the `.system` must have an entry here. `driver` pds may
#     own device/dma mrs (L5) and claim the hardware IRQ numbers listed in
#     `irqs` (L4: an undeclared irq, or any irq on a non-driver, is a
#     violation; L5: the same irq number claimed by two pds); `irqs` is
#     rejected on any other role except `timer`. A `service` pd may own
#     device mrs only if each is a console mr (below; L5 as amended by the
#     M5 plan, C6), and never irqs. `timer` may own device
#     mrs and irqs like a driver, but its device does not seed taint; it
#     is exempt from taint only while it maps nothing but its own device
#     mrs and every channel to it has pp=false on both ends and
#     notify=false on the peer end (L1); a tainted timer is itself an L1
#     violation. `key` pds hold the static secrets and get the
#     taint exemption (L1, L2); there may be several, each mapping
#     exactly its own secrets mr and nothing else, no pd may hold
#     pp=true channels to two of them, and none has more than one pp
#     caller: at most one channel whose peer end is pp=true and whose key
#     end is pp=false (L2: disjoint secrets and disjoint callers, M3 plan
#     Law amendments; no key pd is shared, M6 plan C12; its PPC to `tpm`
#     is not a caller). A `key` pd may have exactly one
#     channel with pp=true on its own end, and it leads to a `tpm` pd (L1
#     as amended by the M5 plan, C9); that channel is no exemption: taint
#     crosses it both ways. `tpm` (C9) owns the TIS device mr (below) and
#     nothing else, must be untainted, maps nothing but its tpm mr, has
#     channels only to `key` pds and is their callee only (pp=false on its
#     own end), and claims no irq; `untrusted_input`,
#     `data` and `service` carry no extra mr privileges of their own but
#     matter for taint reporting and priority ordering (below). Any role,
#     including `driver`, may be the producer of a `data`-kind mr (below)
#     — producing a shared region is a structural (C3) property, not tied
#     to the `data` role tag, which names the dedicated
#     transport-key-holding pd of later milestones.
#
#   [mrs.<name>]
#   kind = "device" | "dma" | "secrets" | "data" | "plain"
#     device: owner = "<driver, timer, service or tpm pd>", phys_addr = <addr>, size = <bytes>,
#             console = <bool, default false>, tpm = <bool, default false>
#       MMIO owned by exactly that driver, page-granular (L5): only the
#       owner may map it, its `.system` `phys_addr`/`size` must match the
#       pinned values here exactly (L5), its range must not overlap
#       another driver's device mr (L5) and must not overlap `[board]
#       ram` (L5; C7 only allows `phys_addr` on a device mr with "no
#       overlap with board RAM").
#       `console = true` marks the one console (M5 plan C6, L5 as amended):
#       its owner must have role `service`, at most one console mr may be
#       declared, it must be pinned at the PL011 page (phys_addr 0x9000000,
#       size 0x1000) and mapped `rw` (Microkit refuses write-only maps; read
#       is for the TX-FIFO flag). Its owner claims no irq (L4), which with
#       no receive code in the PD is the no-RX guarantee. A console mr
#       does not seed taint (L1).
#       `tpm = true` marks the TPM's TIS page (M5 plan C9, L5 as amended):
#       its owner must have role `tpm`, at most one tpm mr may be declared,
#       and it must be pinned at the TIS page of locality 0 (phys_addr
#       0xc000000, size 0x1000). A tpm pd owning any other device mr is an
#       L5 violation. A tpm mr at the TIS page does not seed taint (L1,
#       S14); anywhere else it does.
#     dma: owner = "<driver pd>"
#       A DMA buffer, mapped only into its owning driver (L5) and never
#       shared as a `data` region. `setvar region_paddr` may only name a
#       driver's own dma mr, from within that driver (L5).
#     secrets: owner = "<key pd>"
#       An mr holding static secrets (L2). The owner is required (a
#       secrets mr without one is a policy error) and must have role
#       `key`; each key pd owns at most one. Mapped only into its owner;
#       `prefill_path` is valid on every secrets mr and on nothing else.
#     data: producer = "<pd>", consumers = ["<pd>", ...]
#       Tunnelled-plaintext-shaped sharing (L3): the producer may map with
#       any perms, every consumer must map it read-only, and no other pd
#       may map it at all.
#     plain: shares = { "<pd>" = "<perms>", ... }
#       Any other mr shared between pds (e.g. a ring's free/used metadata,
#       which both sides mutate): each listed pd's actual `.system` map
#       perms must be within what is listed here.
#
#   [[channels]]
#   between = ["<pd>", "<pd>"]
#   pp = { "<pd>" = <bool>, ... }
#   notify = { "<pd>" = <bool>, ... }
#     Every channel in the `.system` must name a pair declared here
#     (unordered; L4 default deny otherwise). `pp`/`notify` pin each end's
#     attribute; a pd missing from either map falls back to the Microkit
#     default for that attribute (`pp` false, `notify` true) — same
#     fallback the `.system` itself gets when the attribute is absent.
#     The *effective* value on each side must match exactly (L4).
#
#   [priority]
#   below = [["<role>", "<role>"]]
#     Every pd of the first role must have a strictly lower `priority`
#     value than every pd of the second role (L13; e.g.
#     `["untrusted_input", "key"]`). May be empty/omitted; empty is
#     vacuously satisfied while no `key`/`timer`-equivalent pd exists yet.
#
#   [budgets]
#   ratio_cap = <0 < x <= 1>
#   ratio_sum_cap = <0 < x <= 0.95>
#     The 0.95 ceiling is hard (M3 plan, Budgets): a policy above it is a
#     policy error, and needing more means re-planning, not an amendment.
#     L13 availability caps applied to every tainted pd (L1): each tainted
#     pd's budget/period ratio must be <= ratio_cap, and the sum of those
#     ratios over all tainted pds must be <= ratio_sum_cap. A tainted pd
#     also needs an *explicit* `budget` and `period` attribute with
#     budget < period (relying on the Microkit default is itself a
#     violation).
#
#   [board]
#   ram = [{ start = <addr>, size = <bytes> }, ...]
#     The board's physical RAM range(s); required (a missing `[board]` is
#     a policy error, not a law violation). Used only to reject a device
#     mr whose pinned physical range overlaps RAM (L5, see `kind =
#     "device"` above).
#
# Design notes (decisions not spelled out by C7 itself, so recorded here):
#   - "Maps a NIC device" (L1's taint seed) is generalised to "maps any
#     device-kind mr owned by a non-timer pd, other than the console and
#     the TPM": every such device is a NIC today, so this is equivalent and
#     keeps the rule simple. The console and TPM exemptions are keyed to
#     the pinned PL011 and TIS pages, not to the flags alone, so a console
#     or tpm mr pinned anywhere else seeds taint (S14).
#   - "x permission on shared maps" is enforced for any mr mapped by more
#     than one distinct pd in the `.system`, regardless of kind.
#   - DOCTYPE, entities and duplicate attributes are rejected by the XML
#     parser itself (exit 2, a parse error), not reported as a law
#     violation — see tools/laws/src/sdf.rs.
#
# Current system (M6: WireGuard responder with cookies, a Rosenpass V02
# responder and the HTTPS endpoint; see system/secureos.system):
#   `eth_out` and `eth_in` own one virtio-net device each (L5) and seed
#   taint. `ingress` (outside) and `inner` (inside) parse attacker-
#   controlled frames; `ingress` also holds the cookie secret, which only
#   gates DoS protection. `hs` parses initiations relayed by `ingress`;
#   `data` holds transport keys and is, with `inner`, the only reader of
#   tunnelled plaintext (L3: the `dn`/`nd` data regions). All of these and
#   `audit` are tainted. `pq` (M3a) runs the Rosenpass responder on
#   datagrams relayed by `ingress` and sends each fresh OSK to `hs`; it is
#   tainted too. `key`, `pqkey` and `tlskey` are the taint-exempt secrets
#   holders (passive; `key` takes PPC from `hs` only and maps only
#   `secrets`, `pqkey` from `pq` only and maps only `pq_secrets`, `tlskey`
#   from `tls` only and maps only `tls_secrets`; L2 as amended).
#   `timer` is exempt as notify-only (L1): it notifies `data`, `hs`,
#   `ingress` and `pq`, none of which can notify it. `audit` (M5) owns the
#   PL011 page as the only console and writes its lines there. `tpm` (M5)
#   owns the TIS page and is called by the three key pds alone, each over
#   its one pp channel, to unseal their secrets at boot; it is untainted
#   and ordered above them (L13, and Microkit's callee-above-caller rule).
#   `tls` (M6) is the HTTPS endpoint: it runs TCP on packets `ingress`
#   vetted (`itl`/`tli`) and reaches its backend through `inner`
#   (`tln`/`ntl`, plaintext of a protected session, L3 as amended); it
#   calls `tlskey` (M6 plan C12) exactly as `hs` calls `key` and no other
#   key pd (L2), and is tainted with role `untrusted_input`, so it runs
#   below the key pds and `timer` (L13 as amended by the M6 plan).

[pds.eth_out]
role = "driver"
irqs = [79]

[pds.eth_in]
role = "driver"
irqs = [71]

[pds.timer]
role = "timer"
irqs = [43]

[pds.key]
role = "key"

[pds.hs]
role = "untrusted_input"

[pds.ingress]
role = "untrusted_input"

[pds.data]
role = "data"

[pds.inner]
role = "untrusted_input"

[pds.audit]
role = "service"

[pds.pq]
role = "untrusted_input"

[pds.pqkey]
role = "key"

[pds.tpm]
role = "tpm"

[pds.tls]
role = "untrusted_input"

[pds.tlskey]
role = "key"

[mrs.eth_out_mmio]
kind = "device"
owner = "eth_out"
phys_addr = 0xa003000
size = 0x1000

[mrs.eth_out_dma]
kind = "dma"
owner = "eth_out"

[mrs.eth_in_mmio]
kind = "device"
owner = "eth_in"
phys_addr = 0xa002000
size = 0x1000

[mrs.eth_in_dma]
kind = "dma"
owner = "eth_in"

[mrs.timer_mmio]
kind = "device"
owner = "timer"
phys_addr = 0x90d0000
size = 0x1000

[mrs.uart_mmio]
kind = "device"
owner = "audit"
phys_addr = 0x9000000
size = 0x1000
console = true

[mrs.tpm_mmio]
kind = "device"
owner = "tpm"
phys_addr = 0xc000000
size = 0x1000
tpm = true

[mrs.secrets]
kind = "secrets"
owner = "key"

[mrs.pq_secrets]
kind = "secrets"
owner = "pqkey"

[mrs.tls_secrets]
kind = "secrets"
owner = "tlskey"

# net_rx: eth_out -> ingress, outside frames in
[mrs.net_rx_used]
kind = "plain"
shares = { eth_out = "rw", ingress = "rw" }

[mrs.net_rx_free]
kind = "plain"
shares = { eth_out = "rw", ingress = "rw" }

[mrs.net_rx_data]
kind = "data"
producer = "eth_out"
consumers = ["ingress"]

# net_tx: ingress -> eth_out, outside frames out
[mrs.net_tx_used]
kind = "plain"
shares = { ingress = "rw", eth_out = "rw" }

[mrs.net_tx_free]
kind = "plain"
shares = { ingress = "rw", eth_out = "rw" }

[mrs.net_tx_data]
kind = "data"
producer = "ingress"
consumers = ["eth_out"]

# inner_rx: eth_in -> inner, inside frames in
[mrs.inner_rx_used]
kind = "plain"
shares = { eth_in = "rw", inner = "rw" }

[mrs.inner_rx_free]
kind = "plain"
shares = { eth_in = "rw", inner = "rw" }

[mrs.inner_rx_data]
kind = "data"
producer = "eth_in"
consumers = ["inner"]

# inner_tx: inner -> eth_in, inside frames out
[mrs.inner_tx_used]
kind = "plain"
shares = { inner = "rw", eth_in = "rw" }

[mrs.inner_tx_free]
kind = "plain"
shares = { inner = "rw", eth_in = "rw" }

[mrs.inner_tx_data]
kind = "data"
producer = "inner"
consumers = ["eth_in"]

# ih: ingress -> hs, initiations
[mrs.ih_used]
kind = "plain"
shares = { ingress = "rw", hs = "rw" }

[mrs.ih_free]
kind = "plain"
shares = { ingress = "rw", hs = "rw" }

[mrs.ih_data]
kind = "data"
producer = "ingress"
consumers = ["hs"]

# hi: hs -> ingress, responses
[mrs.hi_used]
kind = "plain"
shares = { hs = "rw", ingress = "rw" }

[mrs.hi_free]
kind = "plain"
shares = { hs = "rw", ingress = "rw" }

[mrs.hi_data]
kind = "data"
producer = "hs"
consumers = ["ingress"]

# hd: hs -> data, session installs (keys; sender scrubs)
[mrs.hd_used]
kind = "plain"
shares = { hs = "rw", data = "rw" }

[mrs.hd_free]
kind = "plain"
shares = { hs = "rw", data = "rw" }

[mrs.hd_data]
kind = "data"
producer = "hs"
consumers = ["data"]

# id: ingress -> data, inbound transport
[mrs.id_used]
kind = "plain"
shares = { ingress = "rw", data = "rw" }

[mrs.id_free]
kind = "plain"
shares = { ingress = "rw", data = "rw" }

[mrs.id_data]
kind = "data"
producer = "ingress"
consumers = ["data"]

# di: data -> ingress, outbound transport, endpoint updates
[mrs.di_used]
kind = "plain"
shares = { data = "rw", ingress = "rw" }

[mrs.di_free]
kind = "plain"
shares = { data = "rw", ingress = "rw" }

[mrs.di_data]
kind = "data"
producer = "data"
consumers = ["ingress"]

# dn: data -> inner, decrypted IPv4 (plaintext)
[mrs.dn_used]
kind = "plain"
shares = { data = "rw", inner = "rw" }

[mrs.dn_free]
kind = "plain"
shares = { data = "rw", inner = "rw" }

[mrs.dn_data]
kind = "data"
producer = "data"
consumers = ["inner"]

# nd: inner -> data, IPv4 to encrypt (plaintext)
[mrs.nd_used]
kind = "plain"
shares = { inner = "rw", data = "rw" }

[mrs.nd_free]
kind = "plain"
shares = { inner = "rw", data = "rw" }

[mrs.nd_data]
kind = "data"
producer = "inner"
consumers = ["data"]

# ipq: ingress -> pq, InitHello and InitConf
[mrs.ipq_used]
kind = "plain"
shares = { ingress = "rw", pq = "rw" }

[mrs.ipq_free]
kind = "plain"
shares = { ingress = "rw", pq = "rw" }

[mrs.ipq_data]
kind = "data"
producer = "ingress"
consumers = ["pq"]

# pqi: pq -> ingress, RespHello and EmptyData
[mrs.pqi_used]
kind = "plain"
shares = { pq = "rw", ingress = "rw" }

[mrs.pqi_free]
kind = "plain"
shares = { pq = "rw", ingress = "rw" }

[mrs.pqi_data]
kind = "data"
producer = "pq"
consumers = ["ingress"]

# pqh: pq -> hs, PskInstall (OSK; sender scrubs)
[mrs.pqh_used]
kind = "plain"
shares = { pq = "rw", hs = "rw" }

[mrs.pqh_free]
kind = "plain"
shares = { pq = "rw", hs = "rw" }

[mrs.pqh_data]
kind = "data"
producer = "pq"
consumers = ["hs"]

# itl: ingress -> tls, vetted TCP to the HTTPS port
[mrs.itl_used]
kind = "plain"
shares = { ingress = "rw", tls = "rw" }

[mrs.itl_free]
kind = "plain"
shares = { ingress = "rw", tls = "rw" }

[mrs.itl_data]
kind = "data"
producer = "ingress"
consumers = ["tls"]

# tli: tls -> ingress, TCP from the HTTPS port
[mrs.tli_used]
kind = "plain"
shares = { tls = "rw", ingress = "rw" }

[mrs.tli_free]
kind = "plain"
shares = { tls = "rw", ingress = "rw" }

[mrs.tli_data]
kind = "data"
producer = "tls"
consumers = ["ingress"]

# tln: tls -> inner, TCP to the backend (plaintext)
[mrs.tln_used]
kind = "plain"
shares = { tls = "rw", inner = "rw" }

[mrs.tln_free]
kind = "plain"
shares = { tls = "rw", inner = "rw" }

[mrs.tln_data]
kind = "data"
producer = "tls"
consumers = ["inner"]

# ntl: inner -> tls, TCP from the backend (plaintext)
[mrs.ntl_used]
kind = "plain"
shares = { inner = "rw", tls = "rw" }

[mrs.ntl_free]
kind = "plain"
shares = { inner = "rw", tls = "rw" }

[mrs.ntl_data]
kind = "data"
producer = "inner"
consumers = ["tls"]

[mrs.audit_ingress]
kind = "plain"
shares = { ingress = "rw", audit = "rw" }

[mrs.audit_eth_out]
kind = "plain"
shares = { eth_out = "rw", audit = "rw" }

[mrs.audit_eth_in]
kind = "plain"
shares = { eth_in = "rw", audit = "rw" }

[mrs.audit_inner]
kind = "plain"
shares = { inner = "rw", audit = "rw" }

[mrs.audit_hs]
kind = "plain"
shares = { hs = "rw", audit = "rw" }

[mrs.audit_data]
kind = "plain"
shares = { data = "rw", audit = "rw" }

[mrs.audit_pq]
kind = "plain"
shares = { pq = "rw", audit = "rw" }

[mrs.audit_tls]
kind = "plain"
shares = { tls = "rw", audit = "rw" }

[[channels]]
between = ["eth_out", "ingress"]
pp = { eth_out = false, ingress = false }
notify = { eth_out = true, ingress = true }

[[channels]]
between = ["eth_out", "audit"]
pp = { eth_out = false, audit = false }
notify = { eth_out = true, audit = true }

[[channels]]
between = ["ingress", "audit"]
pp = { ingress = false, audit = false }
notify = { ingress = true, audit = true }

[[channels]]
between = ["eth_in", "inner"]
pp = { eth_in = false, inner = false }
notify = { eth_in = true, inner = true }

[[channels]]
between = ["eth_in", "audit"]
pp = { eth_in = false, audit = false }
notify = { eth_in = true, audit = true }

[[channels]]
between = ["inner", "audit"]
pp = { inner = false, audit = false }
notify = { inner = true, audit = true }

[[channels]]
between = ["hs", "audit"]
pp = { hs = false, audit = false }
notify = { hs = true, audit = true }

[[channels]]
between = ["data", "audit"]
pp = { data = false, audit = false }
notify = { data = true, audit = true }

[[channels]]
between = ["ingress", "hs"]
pp = { ingress = false, hs = false }
notify = { ingress = true, hs = true }

[[channels]]
between = ["ingress", "data"]
pp = { ingress = false, data = false }
notify = { ingress = true, data = true }

[[channels]]
between = ["hs", "data"]
pp = { hs = false, data = false }
notify = { hs = true, data = true }

[[channels]]
between = ["data", "inner"]
pp = { data = false, inner = false }
notify = { data = true, inner = true }

[[channels]]
between = ["hs", "key"]
pp = { hs = true, key = false }
notify = { hs = false, key = true }

[[channels]]
between = ["timer", "data"]
pp = { timer = false, data = false }
notify = { timer = true, data = false }

[[channels]]
between = ["timer", "hs"]
pp = { timer = false, hs = false }
notify = { timer = true, hs = false }

[[channels]]
between = ["timer", "ingress"]
pp = { timer = false, ingress = false }
notify = { timer = true, ingress = false }

[[channels]]
between = ["pq", "pqkey"]
pp = { pq = true, pqkey = false }
notify = { pq = false, pqkey = true }

[[channels]]
between = ["ingress", "pq"]
pp = { ingress = false, pq = false }
notify = { ingress = true, pq = true }

[[channels]]
between = ["pq", "hs"]
pp = { pq = false, hs = false }
notify = { pq = true, hs = true }

[[channels]]
between = ["timer", "pq"]
pp = { timer = false, pq = false }
notify = { timer = true, pq = false }

[[channels]]
between = ["pq", "audit"]
pp = { pq = false, audit = false }
notify = { pq = true, audit = true }

[[channels]]
between = ["key", "tpm"]
pp = { key = true, tpm = false }
notify = { key = false, tpm = false }

[[channels]]
between = ["pqkey", "tpm"]
pp = { pqkey = true, tpm = false }
notify = { pqkey = false, tpm = false }

[[channels]]
between = ["ingress", "tls"]
pp = { ingress = false, tls = false }
notify = { ingress = true, tls = true }

[[channels]]
between = ["tls", "inner"]
pp = { tls = false, inner = false }
notify = { tls = true, inner = true }

[[channels]]
between = ["timer", "tls"]
pp = { timer = false, tls = false }
notify = { timer = true, tls = false }

[[channels]]
between = ["tls", "tlskey"]
pp = { tls = true, tlskey = false }
notify = { tls = false, tlskey = true }

[[channels]]
between = ["tlskey", "tpm"]
pp = { tlskey = true, tpm = false }
notify = { tlskey = false, tpm = false }

[[channels]]
between = ["tls", "audit"]
pp = { tls = false, audit = false }
notify = { tls = true, audit = true }

[priority]
# L13: untrusted-input and tunnel PDs run strictly below `key` and `timer`;
# `tpm`, the key pds' callee, above `key` (M5 plan C9).
below = [
    ["key", "tpm"],
    ["untrusted_input", "key"],
    ["untrusted_input", "timer"],
    ["data", "key"],
    ["data", "timer"],
    ["service", "key"],
    ["service", "timer"],
]

[budgets]
# Tainted ratios: drivers, ingress and inner 0.1 each, hs and data 0.2 (crypto),
# audit 0.05, pq 0.05, tls 0.05; sum 0.95, at the cap. pq's measured need is
# about 0.029 (M3 deviation log, MCE-COST). The cap rose 0.90 -> 0.95 for
# `tls` through the M6 plan's Law amendments table (L13); 0.95 is the hard
# ceiling, so a further tainted pd means re-planning the split.
ratio_cap = 0.25
ratio_sum_cap = 0.95

[board]
# qemu_virt_aarch64: 2 GiB RAM starting at 0x4000_0000 (`-m 2G`).
ram = [{ start = 0x4000_0000, size = 0x8000_0000 }]
